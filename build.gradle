plugins {
    id 'java-library'
    // ตรวจเวอร์ชันล่าสุดได้ที่ https://plugins.gradle.org/plugin/net.neoforged.moddev
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.0.0'
group = 'com.example.distanceleveling'

base {
    archivesName = 'distanceleveling'
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

repositories {
    mavenCentral()
}

neoForge {
    // ตรวจเวอร์ชัน 21.1.x ล่าสุดได้ที่ https://projects.neoforged.net/neoforged/neoforge
    version = '21.1.172'

    runs {
        client {
            client()
        }
        server {
            server()
            programArgument '--nogui'
        }
    }

    mods {
        distanceleveling {
            sourceSet sourceSets.main
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
